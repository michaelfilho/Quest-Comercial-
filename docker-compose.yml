services:
  postgres:
    image: postgres:16-alpine
    container_name: quest-playbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-playbook_quest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-quest_user} -d $${POSTGRES_DB:-playbook_quest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quest_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quest-playbook-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: ${API_PREFIX:-/api/v1}
      BASE_PATH: ${BASE_PATH:-/comercial}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-quest_user}:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres:5432/${POSTGRES_DB:-playbook_quest}?schema=public"
      USE_EMBEDDED_PG: "false"
      FRONTEND_URL: ${FRONTEND_URL:-https://questos.com.br/comercial}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-quest_playbook_sid}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Playbook Quest <no-reply@questcomunicacao.com.br>}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - quest_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/comercial/}
        VITE_API_URL: ${VITE_API_URL:-/comercial/api/v1}
    container_name: quest-playbook-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - quest_net

volumes:
  postgres_data:

networks:
  quest_net:
    driver: bridge
