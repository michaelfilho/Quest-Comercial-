server {
    listen 80;
    server_name questos.com.br www.questos.com.br _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck interno do container
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /comercial/healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Proxy de API sob o subpath oficial https://questos.com.br/comercial/api/v1/*
    location /comercial/api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Proxy de API na raiz (caso o proxy externo já tenha feito strip de /comercial)
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Redireciona /comercial sem barra final para /comercial/
    location = /comercial {
        return 301 /comercial/;
    }

    # SPA sob /comercial/
    location /comercial/ {
        try_files $uri $uri/ /index.html;
    }

    # SPA na raiz (fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
