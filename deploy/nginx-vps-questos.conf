# ==============================================================================
# CONFIGURAÇÃO DO REVERSE PROXY NA VPS PARA: https://questos.com.br/comercial
# ==============================================================================
# Adicione os blocos `location` abaixo dentro do `server { server_name questos.com.br; ... }`
# do Nginx principal da sua VPS (ou configure o Path `/comercial` no Coolify / Traefik
# apontando para a porta 8080 do container `quest-playbook-frontend`).

location = /comercial {
    return 301 https://$host/comercial/;
}

location ^~ /comercial/ {
    proxy_pass http://127.0.0.1:8080/comercial/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

